[package]
name = "mywallpaper-desktop-shortcuts-companion"
version = "3.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(windows)'.dependencies]
base64 = "0.22.1"
png = "0.18.0"
rfd = { version = "0.15.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem",
  "Win32_System_Environment", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
